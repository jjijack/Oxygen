# 处理与算法参数配置
# version 1.12 变更：
#   - argo_reconstruction 新增 min_profiles / min_coverage_top1000 / coverage_probe_spacing_m，供批处理重建预筛（剖面数 + ≤1000m 粗探针覆盖率）跳过低覆盖区域，避免无谓 build。
# version 1.11 变更：
#   - 新增 argo_reconstruction 配置小节，集中管理 Argo 3D 高斯核断面重建参数（核带宽/权重阈值/网格步长/半径/时间窗），三个重建函数统一默认 h_bw=60 / min_weight=3.0。
# version 1.10 变更：
#   - 新增 spice 配置小节，百分位阈值判定 T-S spiciness 偏离（核加权，中纬高纬通用）。
# version 1.9 变更：
#   - 新增 heave.z_search_m，等密线连通性检查：仅搜索在 Argo 点附近存在的 σ 面。
#   - z_min 改为与 σ_peak 同一条等密线的最浅深度，H/z_min 物理自洽。
# version 1.8 变更：
#   - 新增 heave 配置小节，统一管理等密面出露诊断的物理阈值参数。
# version 1.7 变更：
#   - 新增 subduction_detection_method，统一选择 do/aou/trim 三种异常识别模式。
#   - 新增 aou_* 与 trim_* 参数，供 DetectionConfig / calculate_delta_do 读取。
#   - 新增 cbar_defaults，按识别方法配置异常散点色标默认范围。
# version 1.6 变更：
#   - 新增 anomaly_max_depth，限制 calculate_delta_do 仅保留该深度以内峰值。
#   - 新增 do_near_zero_threshold / do_near_zero_max_count，近零 DO 点过多时整剖面跳过。
# version 1.5 变更：
#   - 新增 vertical_profile_spacing_km，用于垂向剖面按距离等密度采样。
#   - 新增 vertical_profile_depth_spacing_m，控制 get_vertical_glorys 默认 z 轴等间距插值步长。
# version 1.4 变更：
#   - 原 processing.basemap_colors 变更为 plot.basemap_colors。
# version 1.3 变更：
#   - 新增 anomaly_min_depth 配置，统一控制 ΔDO 异常的最小深度阈值。
# version 1.2 变更：
#   - 新增 basemap 颜色配置（ocean/land/coastline/border/grid）。
# version 1.1 变更：
#   - 移除 distance_earth_deg_per_meter（统一使用 approximate_degree_length 动态纬度尺度）
#   - 新增 adaptive_lat_threshold / adaptive_distance_threshold_km 自适应距离切换阈值（高纬 & 大尺度触发大圆）
version: 1.12
processing:
  circle_enlargement_factor: 1.2   # 匹配涡旋与Argo剖面时半径放大倍数
  default_delta_do_threshold: 50.0
  default_salinity_threshold: 0.0
  default_temperature_threshold: 0.0
  depth_interval: 100.0
  depth_merge_tolerance: 10.0
  duplicate_depth_strategy: best_qc
  anomaly_min_depth: 300.0          # ΔDO 异常最小深度（m）；设为 0 表示不限制
  anomaly_max_depth: 1000.0         # ΔDO 峰值最大深度（m）；设为 0 表示不限制
  do_near_zero_threshold: 1.0       # 近零 DO 判定阈值（DO <= 该值）
  do_near_zero_max_count: 7         # 单剖面近零 DO 超过该数量时，整剖面跳过
  subduction_detection_method: do   # 默认异常识别方法：do | aou | trim
  aou_threshold: -10.0              # aou 模式：ΔAOU 阈值（越负越强）
  pi_threshold: 0.05                # aou 模式：|ΔPI| 阈值
  aou_pi_depth_tolerance: 30.0      # aou 模式：AOU 峰与 PI 峰配对深度容差
  trim_cutoff: 1.96                 # trim 模式：鲁棒标准化残差阈值
  trim_window: 60.0                 # trim 模式：梯度符号检查窗口（±m）
  trim_bin_width_outlier: 40.0      # trim 模式：候选检测分箱宽度
  trim_bin_width_check: 20.0        # trim 模式：梯度检查分箱宽度
  trim_depth_min: 200.0             # trim 模式：候选最小深度
  trim_depth_max: 1000.0            # trim 模式：候选最大深度
  cbar_defaults:
    do:
      min: 50.0
      max: 150.0
    aou:
      min: -60.0
      max: -10.0
    trim:
      min: 2.0
      max: 6.0
  adaptive_lat_threshold: 70.0          # |lat0|>=该值直接大圆距离
  adaptive_distance_threshold_km: 300.0 # 平面最大距离超出触发大圆
  vertical_profile_spacing_km: 2.0      # 垂向剖面横向采样步长（km）
  vertical_profile_depth_spacing_m: 5.0 # 垂向剖面 z 轴采样步长（m）

  # Heave + Ventilation 等密面出露诊断参数
  heave:
    search_range: 0.5               # σ 搜索范围 (kg/m³)，从 σ_argo 向上搜索
    depth_threshold: 300.0          # 通风深度阈值 (m)，z_min 浅于此值视为出露
    magnitude_threshold: 100.0      # Heave 幅度阈值 (m)，等密面起伏 ≥ 此值视为显著位移
    x_window_km: 200.0              # 出露搜索水平窗口半宽 (km)
    local_x_window_km: 50.0         # Heave 局地搜索水平窗口半宽 (km)
    z_search_m: 200.0               # 等密线连通性垂向范围 (m)，仅搜索在 Argo 点 ±200m 内存在过的 σ 面

  # Spiciness 异常阈值（百分位 P < threshold 或 P > 100−threshold 视为显著 T-S 偏离）
  spice:
    percentile_threshold: 10          # P < 10 = 显著冷鲜，P > 90 = 显著暖咸

  # Argo 3D 高斯核断面重建参数（_build_argo_3d_field / plot_*_vertical_argo_overview）
  argo_reconstruction:
    h_bw_km: 60.0             # 水平高斯核带宽（km）：越紧越保中尺度（三个重建函数统一默认）
    min_weight: 3.0           # 最小累积权重阈值：低于此值的格点判为缺测（NaN）
    depth_bw_m: 25.0          # 垂向高斯核带宽（m）
    h_spacing_deg: 0.1        # 重建网格水平间距（°）
    z_max_m: 1500.0           # 最大重建深度（m）
    z_spacing_m: 10.0         # 垂向网格间距（m）
    x_spacing_km: 5.0         # 断面水平采样步长（km）
    radius_km: 400.0          # track/argo 变体的中心半径（km）
    day_window_days: 15       # track/argo 变体的时间窗半宽（天）
    min_profiles: 20          # 批处理预筛：盒子+时间窗内剖面数下限，不足直接跳过不 build
    min_coverage_top1000: 0.5 # 批处理预筛：≤1000m 预估覆盖率下限，不足直接跳过不 build
    coverage_probe_spacing_m: 100.0  # 预估覆盖率的粗深度探针步长（m），越大越快越粗

plot:
  basemap_colors:
    ocean: "#f8fafc"   # 海洋填色
    land: "#d9d9d9"    # 陆地填色
    coastline: "#787d85" # 海岸线颜色
    border: "#9aa0a8"    # 国界线颜色
    grid: "#b6bdc6"      # 格网线颜色
