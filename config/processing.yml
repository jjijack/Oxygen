#     仅在 TEOS-10 入口按纬度转换为海水压力；事件目录、诊断与图表字段同步改为 depth/m。
# version 1.25 变更：
#   - 新增 OFES 客观事件的 ±10 天等密度面演化图、年度总览、Hosoda benchmark 与轨迹门槛配置。
# version 1.24 变更：
#   - 新增 OFES 客观候选的等密度水团/heave 分解、动力量、深层敏感性排名与匹配负对照配置。
# version 1.23 变更：
#   - 新增 OFES 年度向量化 ΔDO20/35/50 扫描、逐日 depth-aware connected objects、跨日 event
#     catalog 与客观排序配置；固定 parity、掩码审计、缓存 provenance 和事件链接门槛。
# version 1.22 变更：
#   - 修正 OFES 为 MOM3 Arakawa B-grid：u/v 均从四个角点共置到示踪物中心；集中记录原生/输出单位、
#     交付垂向坐标与 w 向上为正约定，并将轨迹限制为未验证日场上的定深二维诊断。
# version 1.21 变更：
#   - plot typography 整体提升 2 pt，固化会议投影与后续正式图的可读性标准：
#     figure/panel/axis/tick/annotation 分别为 24/20/17/17/16 pt。
# version 1.20 变更：
#   - plot 新增统一 typography、DO 阈值色/marker、baseline-META-SCV 分组色与 GLORYS×META representation 类别色；
#     供会议图与 detector-neutral Eulerian/SCV 图共享，保持数据类别配色彼此独立。
#   - plot 新增 SCV carrier distribution 的局部阈值色；仅该地图图族使用蓝色 DO20，避免与灰色 DO-evaluable 背景混淆。
