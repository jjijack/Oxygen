# 处理与算法参数配置
# version 1.40 变更：
#   - OFES 输入统一由 paths.yml 的 ./data/OFES_NP30 入口读取，快慢存储
#     只由本地符号链接决定；移除 OXYGEN_OFES_ROOT 单次运行路径旁路。
# version 1.39 变更：
#   - 通风回溯保留 16 事件进程并行，新增 4 路 NetCDF I/O 闸门；
#     并发度不进入科学运行签名。
# version 1.38 变更：
#   - 新增 OFES 峰值日粒子最长 90 天回溯的 MLD 接触史与等密度面出露机会诊断；
#     异常 ensemble 与同日、近深度/同密度的 120–240 km 普通背景粒子配对，
#     另保留 Ro/strain 也匹配的次级敏感性对照；实际 MLD 接触与水平位置上的
#     出露机会严格分开，30/60/90 天窗口按数据起点显式标记左删失。
# version 1.37 变更：
#   - 参照 McCoy et al. (2020) 公开 MATLAB 源码新增 OFES 虚拟 Argo 剖面链：在事件核心与
#     0.35R/0.70R 两圈采样，以目标剖面加 120–240 km、25 km 径向间隔的稀疏环带估计等密度面局地 IQR，
#     逐剖面复现联合有效层屏蔽、spice–N2 门槛、高斯垂向形态和去 BC1 动力高度内峰；明确不复刻
#     get_IQR_data.m 的 no-op/错轴 bug，再用 OFES 原生 u/v 独立确认
#     反气旋旋转。保留现有 5-day SCV-compatible 为更严的持续性子集，不后验放宽。
# version 1.36 变更：
#   - 在已完成的 OFES 三维 ensemble 轨迹上逐日采样 DO、位温、盐度、sigma0 与 spiciness0，
#     并相对 120–240 km 局地背景同时计算固定深度及同密度面异常；复用既有轨迹而不重新积分，
#     事件间支持断点续跑和进程并行，绘图按归一化时间箱让事件等权；温盐/spice 只作同一
#     水团指纹而不当作独立三份证据。
# version 1.35 变更：
#   - 将已验证的 OFES u/v/w 三维 ensemble trajectory 并行推广到 59-event 子集中
#     背景环带完整且 start-to-peak 时间展开的事件；新增事件级进程并行、断点续跑、
#     代表事件逐值复现和观测异常核垂向位移对照口径。
# version 1.34 变更：
#   - 新增 OFES u/v/w 三维 ensemble trajectory：完整交付深度域、层界 w 插值、
#     解析场/步长/可逆性门槛，并预注册同起点固定深度对照、release 敏感性及
#     逐日 ΔDO 核的水平-垂向对照。
# version 1.33 变更：
#   - 新增 OFES w 的 B-grid 连续方程、层界位置、单位与正方向数据集专项验证；
#     三维轨迹只能消费通过预注册门槛的完整 validation manifest。
# version 1.32 变更：
#   - 固化 OFES 二维固定深度 trajectory 的线性日场时间插值、解析场误差、积分域边界和有效粒子门槛。
# version 1.31 变更：
#   - 新增 OFES 全生命周期表层核心加权 Ro 与垂向剖面首层的一致性容差审计。
# version 1.30 变更：
#   - 新增 OFES 同密度面 water-mass patch 连续性、质心流速敏感性、全生命周期表层/深层表达和
#     固定深度二维 ensemble trajectory 的预注册门槛；轨迹运行与论文来源解释分离，三维 w 继续关闭。
# version 1.29 变更：
#   - 新增 OFES 深层事件的客观机制分层与 onset/formation 诊断；固定比较事件出现前、首次进入
#     500 m 以下和峰值阶段的水团/heave、旋转/应变、水平密度梯度、收敛与解析水平锋生率；
#     代表事件另需满足 start-to-peak 时间展开和全程 240 km 背景环带完整性门槛。
# version 1.28 变更：
