# version 1.18 变更：
#   - 新增 subsurface_lens 配置小节，围绕 McCoy et al. (2020) 速度确认 SCV 目录的次表层涡 δDO 分析；
#     含单剖面低 PV 透镜探测三判据阈值（δπ / 表-核比 / N² 比）、局地背景池与诊断网格、候选筛选与
#     相干性参数，供 detect_subsurface_lens 等使用。
#   - 新增 McCoy 动力高度速度判据参数（velocity_criterion 开关、velocity_extent_frac 核带 e⁻² 范围、
#     velocity_equator_lat 赤道跳过阈）：扣第一斜压模后判核带内动力高度异常是否有内部极大＝次表层
#     地转流核，report-only 不进 is_lens gate，由 _dynamic_modes / _dynamic_height_velocity_criterion 支撑。
#   - 新增 GLORYS 漏检检验参数（glorys_sameloc_radius_km 同位读取窗口、mccoy_argo_min_dpi Argo 无信号下限、
#     mccoy_match_days Platform+日期匹配容差）：判 McCoy 核位在 GLORYS T/S 上是否复现 δπ，供
#     glorys_reproduces_mccoy_scv / screen_mccoy_scvs_against_glorys 使用。
#   - 新增纯 GLORYS 全目录检验参数（glorys_bg_radius_km 自身背景窗口、glorys_core_exclude_km 排核半径、
#     glorys_resolve_floor 判"GLORYS 看见"的 |δπ| 绝对阈值 0.07）：仅用核位经纬度+日期+核压判 GLORYS
#     自身背景下核处是否仍有显著 δπ + 弱层结（全 4084，不依赖 BGC Argo），供 glorys_resolves_scv /
#     screen_mccoy_scvs_glorys_resolution 使用。glorys_resolve_floor=0.07 锚定 McCoy 确认涡振幅第 10 百分位
#     ≈0.068 ≈ Chen et al. 2021 |Δπ|>0.05，与 lens 检测器 spice_anom_threshold(0.15) 解耦；相对判据
#     ratio<0.5（Argo 锚定 263，glorys_repro_dpi_frac）不受影响，仍作最有依据的头条。
# version 1.17 变更：
#   - ofes 小节新增 var_subdir（变量名 → 子目录名映射），支持完整数据集按变量分目录布局
#     （u/v/w → <var>_vel，其余用变量名）；_ofes_file_path 据此解析每日单变量文件路径。
# version 1.16 变更：
#   - 新增 ofes 配置小节，集中管理 OFES NP30 数据读取与拉格朗日追踪参数
#     （变量名映射、原型速度单位转换与 RK4 积分步长；网格约定已由 version 1.22 更正为 B-grid）。
# version 1.15 变更：
#   - heave 小节新增 ventilation_mode（fixed / glorys_winter_mld / ht_external，默认 ht_external），
#     把 V/I 通风判据从固定 depth_threshold 改为逐点本地冬季混合层深度阈值（与文件中存的 winter_mld_* 列比较）；
#     新增 glorys_winter_mld_criterion（GLORYS 逐剖面冬季 MLD 的密度判据 kg/m³）。HT 气候态取用变量固定为 mld_dt_max（其余取值实测更差，不设旋钮）。
# version 1.14 变更：
#   - plot 下新增 hotspot_type_colors / hotspot_spice_colors / hotspot_cross_colors 三组配色，
#     分别供 plot_argo_hotspots 的 hotspot_type / spice_type / cross 拆图模式使用。
# version 1.13 变更：
#   - 新增 glorys_residual 配置小节，集中管理 GLORYS 逐点残差 / 垂向细结构丢失统计参数（残差深度/插值步长/高通窗口/同位与匹配半径/经纬度·时间搜索窗/最佳匹配深度覆盖门槛/南大洋分界纬度），供 plot_glorys_detail_loss_residual_atlas 使用。
# version 1.12 变更：
#   - argo_reconstruction 新增 min_profiles / min_coverage_top1000 / coverage_probe_spacing_m，供批处理重建预筛（剖面数 + ≤1000m 粗探针覆盖率）跳过低覆盖区域，避免无谓 build。
# version 1.11 变更：
#   - 新增 argo_reconstruction 配置小节，集中管理 Argo 3D 高斯核断面重建参数（核带宽/权重阈值/网格步长/半径/时间窗），三个重建函数统一默认 h_bw=60 / min_weight=3.0。
# version 1.10 变更：
#   - 新增 spice 配置小节，百分位阈值判定 T-S spiciness 偏离（核加权，中纬高纬通用）。
# version 1.9 变更：
#   - 新增 heave.z_search_m，等密线连通性检查：仅搜索在 Argo 点附近存在的 σ 面。
#   - z_min 改为与 σ_peak 同一条等密线的最浅深度，H/z_min 物理自洽。
# version 1.8 变更：
#   - 新增 heave 配置小节，统一管理等密面出露诊断的物理阈值参数。
# version 1.7 变更：
#   - 新增 subduction_detection_method，统一选择 do/aou/trim 三种异常识别模式。
#   - 新增 aou_* 与 trim_* 参数，供 DetectionConfig / calculate_delta_do 读取。
#   - 新增 cbar_defaults，按识别方法配置异常散点色标默认范围。
# version 1.6 变更：
#   - 新增 anomaly_max_depth，限制 calculate_delta_do 仅保留该深度以内峰值。
#   - 新增 do_near_zero_threshold / do_near_zero_max_count，近零 DO 点过多时整剖面跳过。
# version 1.5 变更：
#   - 新增 vertical_profile_spacing_km，用于垂向剖面按距离等密度采样。
#   - 新增 vertical_profile_depth_spacing_m，控制 get_vertical_glorys 默认 z 轴等间距插值步长。
# version 1.4 变更：
#   - 原 processing.basemap_colors 变更为 plot.basemap_colors。
# version 1.3 变更：
#   - 新增 anomaly_min_depth 配置，统一控制 ΔDO 异常的最小深度阈值。
# version 1.2 变更：
#   - 新增 basemap 颜色配置（ocean/land/coastline/border/grid）。
# version 1.1 变更：
#   - 移除 distance_earth_deg_per_meter（统一使用 approximate_degree_length 动态纬度尺度）
#   - 新增 adaptive_lat_threshold / adaptive_distance_threshold_km 自适应距离切换阈值（高纬 & 大尺度触发大圆）
version: "1.40"
processing:
  circle_enlargement_factor: 1.2   # 匹配涡旋与Argo剖面时半径放大倍数
  default_delta_do_threshold: 50.0
  default_salinity_threshold: 0.0
  default_temperature_threshold: 0.0
  depth_interval: 100.0
  depth_merge_tolerance: 10.0
  duplicate_depth_strategy: best_qc
  anomaly_min_depth: 300.0          # ΔDO 异常最小深度（m）；设为 0 表示不限制
  anomaly_max_depth: 1000.0         # ΔDO 峰值最大深度（m）；设为 0 表示不限制
  do_near_zero_threshold: 1.0       # 近零 DO 判定阈值（DO <= 该值）
  do_near_zero_max_count: 7         # 单剖面近零 DO 超过该数量时，整剖面跳过
  subduction_detection_method: do   # 默认异常识别方法：do | aou | trim
  aou_threshold: -10.0              # aou 模式：ΔAOU 阈值（越负越强）
  pi_threshold: 0.05                # aou 模式：|ΔPI| 阈值
  aou_pi_depth_tolerance: 30.0      # aou 模式：AOU 峰与 PI 峰配对深度容差
  trim_cutoff: 1.96                 # trim 模式：鲁棒标准化残差阈值
  trim_window: 60.0                 # trim 模式：梯度符号检查窗口（±m）
  trim_bin_width_outlier: 40.0      # trim 模式：候选检测分箱宽度
  trim_bin_width_check: 20.0        # trim 模式：梯度检查分箱宽度
  trim_depth_min: 200.0             # trim 模式：候选最小深度
  trim_depth_max: 1000.0            # trim 模式：候选最大深度
  cbar_defaults:
    do:
      min: 50.0
      max: 150.0
    aou:
      min: -60.0
      max: -10.0
    trim:
      min: 2.0
      max: 6.0
  adaptive_lat_threshold: 70.0          # |lat0|>=该值直接大圆距离
  adaptive_distance_threshold_km: 300.0 # 平面最大距离超出触发大圆
  vertical_profile_spacing_km: 2.0      # 垂向剖面横向采样步长（km）
  vertical_profile_depth_spacing_m: 5.0 # 垂向剖面 z 轴采样步长（m）

  # Heave + Ventilation 等密面出露诊断参数
  heave:
    search_range: 0.5               # σ 搜索范围 (kg/m³)，从 σ_argo 向上搜索
    ventilation_mode: ht_external   # V/I 通风判据阈值来源：fixed（固定 depth_threshold）/ glorys_winter_mld（GLORYS 逐剖面冬季 MLD）/ ht_external（Holte-Talley 气候态本地冬季 MLD）
    depth_threshold: 300.0          # 固定模式 / 单图标注用通风深度阈值 (m)，z_min 浅于此值视为出露
    glorys_winter_mld_criterion: 0.125  # glorys_winter_mld 模式选用的密度判据 (kg/m³)：0.03 或 0.125
    magnitude_threshold: 100.0      # Heave 幅度阈值 (m)，等密面起伏 ≥ 此值视为显著位移
    x_window_km: 200.0              # 出露搜索水平窗口半宽 (km)
    local_x_window_km: 50.0         # Heave 局地搜索水平窗口半宽 (km)
    z_search_m: 200.0               # 等密线连通性垂向范围 (m)，仅搜索在 Argo 点 ±200m 内存在过的 σ 面

  # Spiciness 异常阈值（百分位 P < threshold 或 P > 100−threshold 视为显著 T-S 偏离）
  spice:
    percentile_threshold: 10          # P < 10 = 显著冷鲜，P > 90 = 显著暖咸

  # Argo 3D 高斯核断面重建参数（_build_argo_3d_field / plot_*_vertical_argo_overview）
  argo_reconstruction:
    h_bw_km: 60.0             # 水平高斯核带宽（km）：越紧越保中尺度（三个重建函数统一默认）
    min_weight: 3.0           # 最小累积权重阈值：低于此值的格点判为缺测（NaN）
    depth_bw_m: 25.0          # 垂向高斯核带宽（m）
    h_spacing_deg: 0.1        # 重建网格水平间距（°）
    z_max_m: 1500.0           # 最大重建深度（m）
    z_spacing_m: 10.0         # 垂向网格间距（m）
    x_spacing_km: 5.0         # 断面水平采样步长（km）
    radius_km: 400.0          # track/argo 变体的中心半径（km）
    day_window_days: 15       # track/argo 变体的时间窗半宽（天）
    min_profiles: 20          # 批处理预筛：盒子+时间窗内剖面数下限，不足直接跳过不 build
    min_coverage_top1000: 0.5 # 批处理预筛：≤1000m 预估覆盖率下限，不足直接跳过不 build
    coverage_probe_spacing_m: 100.0  # 预估覆盖率的粗深度探针步长（m），越大越快越粗

  # GLORYS 逐点残差 / 垂向细结构丢失统计（plot_glorys_detail_loss_residual_atlas）
  glorys_residual:
    z_max_m: 1000.0           # 残差比较的最大深度（m）
    z_spacing_m: 5.0          # 潜温廓线统一插值的垂向间距（m）
    fine_struct_window: 15    # 高通细结构的滚动窗口点数（×z_spacing_m = 物理尺度）
    sameloc_radius_km: 40.0   # 同位 GLORYS 读取窗口半宽（km）
    match_radius_km: 140.0    # 最佳匹配搜索的 GLORYS 读取窗口半宽（km）
    match_window_deg: 1.0     # 最佳匹配的经纬度搜索半宽（°）
    match_window_days: 1      # 最佳匹配的时间搜索半宽（天）
    match_min_depth_coverage: 0.8  # 候选 GLORYS 列须覆盖 Argo 廓线深度范围的最低比例，防浅海床列以截断深度刷低 RMS 胜出
    so_lat_threshold: -40.0   # 南大洋专项分界纬度（°）

  # 单剖面次表层涡（低 PV 透镜）探测（detect_subsurface_lens / plot_subsurface_lens_diagnostic）
  subsurface_lens:
    bg_box_deg: 3.0           # 局地背景 Argo 池的经纬度半宽（°）
    bg_window_days: 45        # 局地背景池的时间半窗（天，同年；深层 T-S(σ) 季节稳定）
    z_max_m: 1500.0           # 诊断最大深度（m）
    z_spacing_m: 10.0         # 垂向统一插值间距（m）
    z_min_core_m: 150.0       # 核搜索最小深度（m），排除季节性混合层
    surf_layer_m: 100.0       # 表层参考层上界（m），算表-核 |δπ| 比
    spice_sigma_bandwidth: 0.25  # δπ 的 σ₀ 高斯核带宽（kg/m³）
    spice_anom_threshold: 0.15   # |δπ_core| 显著阈值，判定核处水团偏离
    surf_core_ratio_max: 0.5     # 表-核 |δπ| 比上限（越小越"次表层强化"）
    n2_ratio_max: 0.6            # N²_prof/N²_bg 上限（核处层结被均质化＝低 PV 透镜）
    min_bg_profiles: 10          # 背景池有效剖面数下限，不足则判背景不足
    eddy_enlarge_factor: 1.2     # 面涡圆判定的半径放大倍数（沿用 circle_enlargement_factor 语义）
    glorys_repro_dpi_frac: 0.5   # GLORYS 核处 |δπ| 保留 < 该比例×Argo 则判 GLORYS 抹平（漏涡）
    coherence_window_days: 20    # 相干性：同浮标其他周期 / 邻剖面的时间半窗（天）
    coherence_radius_km: 150.0   # 相干性：邻剖面搜索半径（km）
    coherence_sigma_tol: 0.3     # 相干性：判同一透镜的核 σ₀ 容差（kg/m³）
    coherence_min_profiles: 2    # 相干性：达成"相干"所需的同号透镜剖面数（含种子）
    velocity_criterion: true       # 是否计算 McCoy 动力高度速度判据（report-only，不进 is_lens gate）
    velocity_extent_frac: 0.135    # 核带 [pl,ph] 取 |δπ| 衰减到峰值此比例处（≈ 核 ±√2·H 的高斯 e⁻² 范围）
    velocity_equator_lat: 5.0      # |纬度|<此值跳过速度判据（赤道 f→0 地转失效；McCoy 同此阈）
    glorys_sameloc_radius_km: 40.0 # GLORYS 同位 thetao+so 列读取窗口半宽（km，复现测试共用）
    mccoy_argo_min_dpi: 0.05       # McCoy 核处 Argo |δπ| 下限；低于此值判"Argo 自身无信号"（我们的局地池法看不到该异常，无法据以判 GLORYS 漏检）
    mccoy_match_days: 5            # McCoy SCV 周期日期 ↔ 我们 Argo 剖面的 Platform+日期匹配容差（天）
    glorys_bg_radius_km: 120.0     # 纯 GLORYS 检验：核位周围取此半径窗口作 GLORYS 自身背景（km）
    glorys_core_exclude_km: 30.0   # 纯 GLORYS 检验：背景排除中心此半径内网格（避免涡核污染背景，km）
    glorys_resolve_floor: 0.07     # 纯 GLORYS 检验判"GLORYS 看见"的 |δπ| 绝对阈值；锚定 McCoy 确认涡在我们度量下振幅的 10th 百分位(≈0.068)≈Chen2021 |Δπ|>0.05；与 lens 检测器 spice_anom_threshold(0.15) 解耦

