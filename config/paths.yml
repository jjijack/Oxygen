# 数据路径配置
# version 1.10 变更：
#   - 新增 ofes_surface_eddy_root：OFES PET surface-eddy 正式目录。
# version 1.9 变更：
#   - 新增 mccoy_scv_source_archive，将 OFES 虚拟 Argo 复现运行绑定到 McCoy et al. (2020)
#     公开 MATLAB 源码归档的实际文件身份。
# version 1.8 变更：
#   - 新增 mccoy_scv_csv：McCoy et al. (2020) 全球 Argo SCV 检测目录 CSV 路径，供 GLORYS 漏检检验
#     （screen_mccoy_scvs_against_glorys / glorys_reproduces_mccoy_scv）读取已确认 SCV 核位。
# version 1.7 变更：
#   - 新增 ofes_root：OFES NP30 高分辨率模型输出根目录（日均 netCDF），供 load_ofes_snapshot 等使用。
# version 1.6 变更：
#   - 新增 mld_clim_root：外部混合层深度气候态根目录（含 Holte-Talley Argo MLD netCDF），供 load_mld_climatology / get_winter_mld_ht 等使用。
# version 1.5 变更：
#   - 新增 woa23_root：WOA23 气候态数据根目录（含 oxygen/ 子目录），供 load_woa_oxygen / get_woa_do_profile 等使用。
# version 1.4 变更：
#   - 新增 classification_overrides：人工分类修正表路径（csv，纯文本便于频繁编辑），供下游覆盖自动 hotspot_type / spice_type。
# version 1.3 变更：
#   - 新增 glorys_processed：GLORYS 处理后产物目录（如 EKE zarr 缓存），默认 ./GLORYS_processed。
# version 1.2 变更：
#   - 新增 plots_output（绘图输出根目录；默认 ./plot_outputs）。
#   - 新增 gpd_world_shp：本地 Natural Earth 底图路径（避免使用已弃用的 geopandas.datasets 并消除告警）。
# version 1.1 变更：
#   - 新增 meta_root (META 3.x 数据根目录)
#   - 新增 META_tracks_root (导出结果根目录；默认 ./META_tracks)
version: 1.10
paths:
  argo_origin: ./Argo_origin
  argo_intermediate: ./Argo_data_tmp
  argo_parquet: ./Argo_data
  argo_mat_input: ./Argo_addFloat
  glorys_root: ../copernicus/GLORYS
  glorys_processed: ./GLORYS_processed
  meta_root: ../META3.2_DT_allsat
  META_tracks_root: ./META_tracks
  plots_output: ./plot_outputs
  gpd_world_shp: ./external/natural_earth/ne_110m_admin_0_countries.shp
  classification_overrides: ./data/classification_overrides.csv
  woa23_root: ./data/woa23
  mld_clim_root: ./data/mld_clim
  ofes_root: ./data/OFES_NP30
  ofes_surface_eddy_root: ./plot_outputs/do/ofes_np30_ke/surface_eddy
  mccoy_scv_csv: ./data/mccoy2020_scv/SCVs.csv
  mccoy_scv_source_archive: ./data/mccoy2020_scv/ArgoSCVs-v1.3.zip
